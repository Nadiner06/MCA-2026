<script type="module">
    import 'https://editor.verovio.org/javascript/app/verovio-app.js';

    const app = new Verovio.App(
        document.getElementById("app"), {}
    );

    fetch("filename.mei")
        .then(response => {
            if (!response.ok) {
                throw new Error("MEI file could not be loaded");
            }
            return response.text();
        })
        .then(text => {
            app.loadData(text);
        })
        .catch(error => console.error(error));
</script>
